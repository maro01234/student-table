<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生徒別の平均点</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <div class="eyebrow">STUDENT SCORE TABLE</div>
    <h1>生徒別の平均点</h1>
    <p class="intro">生徒名と平均点を、表で見やすく。セルを選んで編集できます。</p>
    <div class="toolbar"><span id="count">読み込み中…</span><span>100点満点 · 小数第1位表示</span></div>
    <div class="sheet">
      <table aria-label="生徒名と平均点">
        <thead><tr>
          <th scope="col" class="row-number">#</th>
          <th scope="col" aria-sort="none"><button id="sort-name" type="button">生徒名 <span aria-hidden="true">↕</span></button></th>
          <th scope="col" aria-sort="none"><button id="sort-score" type="button">平均点 <span aria-hidden="true">↕</span></button></th>
        </tr></thead>
        <tbody id="students"></tbody>
      </table>
    </div>
    <p id="status" role="status" aria-live="polite">データを読み込んでいます。</p>
    <button id="retry" type="button" hidden>再読み込み</button>
    <p class="note">列名を押すと並べ替えられます。編集内容はこの画面だけに反映され、再読み込みすると元に戻ります。</p>
    <noscript>この表の表示と編集にはJavaScriptを有効にしてください。</noscript>
    <footer>Java 17 · サンプルの計算済み平均点を表示</footer>
  </main>
</body>
</html>
